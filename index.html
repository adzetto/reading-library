<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Okuma Kütüphanesi · İngilizce metinleri Türkçe destekle okuyun</title>
<meta name="description" content="Akademik makaleler ve İngilizce kitaplar; sözcüğe tıklayınca Türkçesi, cümle çevirisi, seslendirme, sözcük defteri ve sınav.">
<meta name="theme-color" content="#fbfaf7">
<link rel="stylesheet" href="assets/vendor/katex.min.css">
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/library.css">
<link rel="stylesheet" href="assets/hero.css">
<link rel="stylesheet" href="assets/stats.css">
<link rel="stylesheet" href="assets/tts.css">
</head>
<body>

<!-- ======================= ÜST ÇUBUK ======================= -->
<header id="topbar">
  <a class="brand" href="#/" aria-label="Kütüphane">
    <span class="mark" id="brandMark"></span><span class="name">Okuma Kütüphanesi</span>
  </a>
  <nav class="topnav">
    <a class="btn mini" href="#/" id="navLib"></a>
    <a class="btn mini" href="#/stats" id="navStats"></a>
    <button class="btn mini icon" id="themeBtn" title="Tema" aria-label="Tema"></button>
  </nav>
</header>

<!-- ======================= GÖRÜNÜMLER ======================= -->
<main id="view"></main>

<!-- kütüphane görünümü şablonu -->
<template id="tpl-library">
  <section class="hero">
    <div class="hero-grid">
      <div class="hero-in">
        <p class="hero-kicker">Kütüphaneden bir satır</p>
        <!-- Manşet bir iddia değil, GÖSTERİ: kütüphanedeki gerçek bir
             kitaptan gerçek bir cümle, altında bilinmeyen sözcüklerin
             Türkçesi. hero-read.js dolduruyor; JS çalışmazsa buradaki
             yedek metin okunur kalır. -->
        <h1 class="hero-h1 hero-read" id="heroRead">They were not half living, or quarter living.</h1>
        <p class="hero-source" id="heroSource" hidden></p>
        <p class="hero-sub">
          Bilmediğiniz sözcüğe dokunun, karşılığı gelsin.
        </p>
        <div class="hero-stats" id="heroStats"></div>
        <!-- İki kademeli CTA: birincil dolu, ikincil çerçeveli. "Kaldığım
             yerden devam" yalnızca kayıtlı ilerleme varsa açılıyor, o
             yüzden her hâlükârda görünen bir birincil eylem gerekiyor —
             yoksa hero tek hayalet düğmeyle kalıyor. -->
        <div class="hero-cta">
          <button class="btn primary" id="continueBtn" hidden></button>
          <button type="button" class="btn primary" id="heroStartBtn">Okumaya başla</button>
          <a class="btn" href="#/stats" id="heroStatsLink">İlerlemem</a>
        </div>
        <div class="hero-bar" id="heroBar" hidden></div>
      </div>
      <div class="hero-orb" id="heroOrb">
        <canvas id="globe" aria-hidden="true"></canvas>
      </div>
    </div>
  </section>

  <section class="lib">
    <div class="lib-head">
      <h2>Kütüphane</h2>
      <div class="lib-filters" id="libFilters"></div>
    </div>
    <div class="decks" id="libDecks"></div>
    <div class="cards" id="cards"></div>
  </section>
</template>

<!-- okuyucu görünümü şablonu -->
<template id="tpl-reader">
  <div id="shell">
    <aside id="side">
      <a class="side-back btn mini" href="#/">← Kütüphane</a>
      <h2>İçindekiler</h2>
      <ul id="toc"></ul>
    </aside>
    <div id="main"><article id="article"></article></div>
  </div>

  <div id="bar">
    <div id="prog"></div>
    <button class="btn mini icon" id="menuBtn" title="İçindekiler" aria-label="İçindekiler"></button>
    <span class="pos" id="pos"></span>
    <span class="sp"></span>
    <div class="grp">
      <button class="btn mini icon" id="narrowBtn" title="Satır ölçüsünü daralt" aria-label="Daralt"></button>
      <button class="btn mini icon" id="widerBtn" title="Satır ölçüsünü genişlet" aria-label="Genişlet"></button>
      <button class="btn mini icon" id="ttsBtn" title="Seslendir" aria-label="Seslendir"></button>
      <button class="btn mini" id="dictBtn" title="Sözlük"></button>
      <button class="btn mini icon" id="markBtn" title="Sözlükte kayıtlı sözcüklerin altını çiz" aria-label="Altını çiz"></button>
      <button class="btn mini" id="vocabBtn" title="Sözcük defteri"></button>
      <button class="btn mini" id="quizBtn" title="Sınav"></button>
    </div>
  </div>
</template>

<!-- ======================= KATMANLAR ======================= -->
<div id="drawerLayer">
  <aside id="drawer">
    <div class="dw-hd">
      <h3>Sözcük defteri</h3>
      <button class="btn mini icon" id="dwClose" aria-label="Kapat"></button>
    </div>
    <div class="dw-body" id="vocabList"></div>
    <div class="dw-ft">
      <button class="btn mini" id="dwExport">CSV indir</button>
      <button class="btn mini" id="dwClear">Temizle</button>
    </div>
  </aside>
</div>
<div id="scrim"></div>
<div id="pop"><div class="arrow"></div></div>
<div id="toast"></div>

<!-- ======================= BETİKLER ======================= -->
<script src="assets/vendor/bundle.js"></script>
<script src="assets/vendor/motion.min.js"></script>
<script src="assets/vendor/gsap.min.js"></script>
<script src="assets/vendor/ScrollTrigger.min.js"></script>
<script src="assets/vendor/lenis.min.js"></script>
<script src="assets/vendor/katex.min.js"></script>

<script src="assets/dict-core.js"></script>
<script src="assets/dict-a-c.js"></script>
<script src="assets/dict-d-h.js"></script>
<script src="assets/dict-i-p.js"></script>
<script src="assets/dict-q-z.js"></script>
<script src="assets/lookup.js"></script>

<script src="assets/store.js"></script>
<script src="assets/tables.js"></script>
<!-- Belge üstverisi: kart listesi için gereken küçük dizin (~7 KB).
     Gövdeler açılışta YÜKLENMEZ; app.js ensureDoc() ilgili belge
     açılınca <script> enjekte ederek getirir. Hepsini burada
     yüklemek tam romanlarla birlikte 6 MB'ı geçiyordu. -->
<script src="assets/docs/meta.js"></script>
<script src="assets/docs/manifest-full.js"></script>
<script src="assets/docs/manifest-books.js"></script>
<script src="assets/docs/manifest.js"></script>

<script src="assets/wordgraph.js"></script>
<script src="assets/globe.js"></script>
<script src="assets/hero-motion.js"></script>
<script src="assets/hero-read.js"></script>

<script src="assets/icons.js"></script>
<script src="assets/audio/index.js"></script>
<script src="assets/tts.js"></script>
<script src="assets/tts-audio.js"></script>
<script src="assets/tts-panel.js"></script>
<script src="assets/quiz.js"></script>
<script src="assets/stats.js"></script>
<script src="assets/pdf-import.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
